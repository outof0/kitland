name: Feature request
description: Propose a focused tool or product improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the developer problem, not private production data. Do not include credentials, tokens, proprietary payloads, or security vulnerabilities.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today, and who experiences it?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web
        - Browser extension
        - VS Code extension
        - Shared core or registry
        - Documentation or contributor tooling
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and a minimal example.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Capability and privacy impact
      description: Note any clipboard, file, editor, network, persistence, or remote-processing capability involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or narrower approaches.
