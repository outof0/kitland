name: Bug report
description: Report a reproducible problem in Kitland
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, private keys, personal data, or sensitive payloads. For security vulnerabilities, follow SECURITY.md instead.
  - type: input
    id: tool
    attributes:
      label: Affected tool or page
      placeholder: Base64 /explore/base64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Use a minimal, non-sensitive example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, and Kitland version or commit
