name: Release

# Unified release pipeline for all Kitland distribution surfaces.
# - Secrets: GitHub Actions repository secrets
# - npm (MCP): granular-token publishing + provenance
# - VS Code Marketplace + Open VSX: publish when their optional PAT is configured
# - Chrome Web Store + Firefox AMO: deterministic browser artifacts, creds from GitHub Actions secrets
# - Cloudflare Pages: deploy the verified static web artifact to production
# - GitHub: publish an immutable release only after every required distribution succeeds
# Trigger via explicit tag push (Conventional Commits) or manual dispatch.

permissions:
  # Create the GitHub Release only after every external distribution has passed.
  contents: write
  # npm provenance exchanges GitHub's OIDC token for a signed registry attestation.
  # This permission does not restore the removed external secret-store integration.
  id-token: write
  # The reusable CI contract declares its Cloudflare deployment jobs even
  # though their branch-only conditions skip them for a release tag. GitHub
  # validates those nested job permissions before evaluating conditions.
  deployments: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag matching package.json, for example v0.1.0"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate (reuse CI contract)
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, package and publish
    needs: quality
    if: >-
      github.ref_type == 'tag'
      || (github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Settings -> Secrets and variables -> Actions -> Repository secrets.
    # GitHub masks these values; only their stable environment names are used below.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
      WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require credentials for required distributions
        run: |
          required=(
            NPM_TOKEN:NODE_AUTH_TOKEN
            CHROME_EXTENSION_ID:CHROME_EXTENSION_ID
            CHROME_CLIENT_ID:CHROME_CLIENT_ID
            CHROME_CLIENT_SECRET:CHROME_CLIENT_SECRET
            CHROME_REFRESH_TOKEN:CHROME_REFRESH_TOKEN
            WEB_EXT_API_KEY:WEB_EXT_API_KEY WEB_EXT_API_SECRET:WEB_EXT_API_SECRET
            CLOUDFLARE_API_TOKEN:CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID:CLOUDFLARE_ACCOUNT_ID
          )
          missing=()
          for mapping in "${required[@]}"; do
            secret_name="${mapping%%:*}"
            env_name="${mapping#*:}"
            if [ -z "${!env_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Full release blocked: missing GitHub repository secrets: ${missing[*]}"
            echo "::error::Configure them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT is not configured; skipping VS Code Marketplace publication. The VSIX will still be attached to the GitHub Release."
          fi
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT is not configured; skipping Open VSX publication. The VSIX will still be attached to the GitHub Release."
          fi

      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          BROWSER_VERSION="$(node -p "require('./apps/browser-extension/package.json').version")"
          VSCODE_VERSION="$(node -p "require('./apps/vscode-extension/package.json').version")"
          echo "Tag: $TAG"
          echo "root: $PKG_VERSION  mcp: $MCP_VERSION  browser: $BROWSER_VERSION  vscode: $VSCODE_VERSION"
          test "v$PKG_VERSION" = "$TAG" || { echo "::error::Tag $TAG does not match root package.json v$PKG_VERSION"; exit 1; }
          test "$PKG_VERSION" = "$MCP_VERSION" || { echo "::error::Version drift root vs mcp ($PKG_VERSION vs $MCP_VERSION)"; exit 1; }
          test "$PKG_VERSION" = "$BROWSER_VERSION" || { echo "::error::Version drift root vs browser-extension"; exit 1; }
          test "$PKG_VERSION" = "$VSCODE_VERSION" || { echo "::error::Version drift root vs vscode-extension"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.12.0

      - name: Setup Node.js (with npm registry for provenance)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify complete-suite release gate
        run: pnpm release:verify

      - name: Build all packages
        run: pnpm build

      # --- Browser extension: deterministic Chrome + Firefox zips ---
      - name: Package browser extension (Chrome + Firefox)
        run: pnpm --filter @kitland/browser-extension package:all

      - name: Verify Chrome / Firefox artifacts exist
        run: |
          ls -lh apps/browser-extension/artifacts/
          test -f "apps/browser-extension/artifacts/kitland-chrome-v$(node -p "require('./package.json').version").zip"
          test -f "apps/browser-extension/artifacts/kitland-firefox-v$(node -p "require('./package.json').version").zip"

      # --- VS Code extension ---
      - name: Package VS Code extension (VSIX)
        run: pnpm --filter kitland-tools package:vsix

      - name: Verify VSIX exists
        run: ls -lh apps/vscode-extension/artifacts/*.vsix

      # --- MCP npm package ---
      - name: Pack MCP tarball (dry-run validation)
        run: pnpm --filter @kitland/mcp package:check

      - name: Capture MCP tarball path
        id: mcp_tarball
        run: |
          TARBALL="$(pnpm --filter @kitland/mcp pack --dry-run 2>&1 | grep -oE 'kitland-mcp-.*\.tgz' | head -1)"
          if [ -z "$TARBALL" ]; then
            TARBALL="$(npm pack --json --prefix packages/mcp 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0]?.filename || ''")"
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "MCP tarball: $TARBALL"

      # --- Publish: npm (MCP) with provenance ---
      - name: Publish @kitland/mcp to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          PKG_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          TARBALL="packages/mcp/kitland-mcp-${PKG_VERSION}.tgz"
          if [ ! -f "$TARBALL" ]; then
            (cd packages/mcp && npm pack)
            TARBALL="packages/mcp/kitland-mcp-${PKG_VERSION}.tgz"
          fi
          VIEW_OUT="$(mktemp)"; VIEW_ERR="$(mktemp)"
          if npm view "@kitland/mcp@${PKG_VERSION}" dist.integrity --json >"$VIEW_OUT" 2>"$VIEW_ERR"; then
            PUBLISHED="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')))" "$VIEW_OUT")"
            LOCAL="$(node -e "const f=require('fs');const c=require('crypto');process.stdout.write('sha512-'+c.createHash('sha512').update(f.readFileSync(process.argv[1])).digest('base64'))" "$TARBALL")"
            if [ "$PUBLISHED" = "$LOCAL" ]; then
              echo "@kitland/mcp@${PKG_VERSION} already published with matching integrity; skipping."
              exit 0
            else
              echo "::error::npm already has @kitland/mcp@${PKG_VERSION} with different integrity"
              exit 1
            fi
          elif grep -Eq 'E404|404 Not Found' "$VIEW_ERR"; then
            echo "First publish for @kitland/mcp@${PKG_VERSION}"
            npm publish "$TARBALL" --access public --provenance --ignore-scripts
          else
            cat "$VIEW_ERR"; exit 1
          fi

      # --- Publish: VS Code Marketplace + Open VSX ---
      - name: Publish VS Code extension to Marketplace
        if: env.VSCE_PAT != ''
        run: |
          VSIX="$(ls apps/vscode-extension/artifacts/*.vsix | head -1)"
          echo "Publishing $VSIX to VS Code Marketplace…"
          pnpm exec vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish VS Code extension to Open VSX
        if: env.OVSX_PAT != ''
        run: |
          VSIX="$(ls apps/vscode-extension/artifacts/*.vsix | head -1)"
          echo "Publishing $VSIX to Open VSX…"
          pnpm exec ovsx publish "$VSIX" -p "$OVSX_PAT" --skip-duplicate || pnpm dlx ovsx publish "$VSIX" -p "$OVSX_PAT"

      # --- Publish: Chrome Web Store ---
      - name: Publish Chrome extension to Web Store
        run: |
          ZIP="apps/browser-extension/artifacts/kitland-chrome-v$(node -p "require('./package.json').version").zip"
          echo "Uploading $ZIP to Chrome Web Store (extension $CHROME_EXTENSION_ID)…"
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "$ZIP" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --client-id "$CHROME_CLIENT_ID" \
            --client-secret "$CHROME_CLIENT_SECRET" \
            --refresh-token "$CHROME_REFRESH_TOKEN" \
            --auto-publish

      # --- Publish: Firefox AMO ---
      - name: Publish Firefox add-on to AMO
        run: |
          echo "Linting and submitting dist to Firefox AMO…"
          npx --yes web-ext lint --source-dir apps/browser-extension/dist
          npx --yes web-ext sign \
            --source-dir apps/browser-extension/dist \
            --artifacts-dir apps/browser-extension/artifacts \
            --api-key "$WEB_EXT_API_KEY" \
            --api-secret "$WEB_EXT_API_SECRET" \
            --channel listed

      # Deploy last: production never advertises a version that failed to publish.
      - name: Deploy verified landing to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name=kitland --branch=main

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kitland $RELEASE_TAG" \
            --generate-notes \
            "packages/mcp/kitland-mcp-${VERSION}.tgz" \
            apps/vscode-extension/artifacts/*.vsix \
            apps/browser-extension/artifacts/*.zip

      # --- Always keep artifacts for manual follow-up ---
      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kitland-release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/browser-extension/artifacts/*.zip
            apps/vscode-extension/artifacts/*.vsix
            packages/mcp/*.tgz
          if-no-files-found: warn
          retention-days: 30
