name: Release

# Unified release pipeline for all Kitland distribution surfaces.
# - npm (MCP): follows hotpug trusted-publishing pattern (OIDC + provenance)
# - VS Code Marketplace + Open VSX: follows nexusdiff tag-driven flow
# - Chrome Web Store + Firefox AMO: deterministic browser artifacts
# Trigger via explicit tag push (Conventional Commits) or manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      skip_npm:
        description: "Skip npm publishing (MCP)"
        type: boolean
        default: false
      skip_vscode:
        description: "Skip VS Code Marketplace / Open VSX"
        type: boolean
        default: false
      skip_browser:
        description: "Skip Chrome / Firefox Web Store submit"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate (reuse CI contract)
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, package and publish
    needs: quality
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Match hotpug production environment guard – creation not required for tag flow
    environment:
      name: production
      url: https://kitland.dev

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate tag matches package version (tag pushes)
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          MCP_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          BROWSER_VERSION="$(node -p "require('./apps/browser-extension/package.json').version")"
          VSCODE_VERSION="$(node -p "require('./apps/vscode-extension/package.json').version")"
          echo "Tag: $TAG"
          echo "root: $PKG_VERSION  mcp: $MCP_VERSION  browser: $BROWSER_VERSION  vscode: $VSCODE_VERSION"
          test "v$PKG_VERSION" = "$TAG" || { echo "::error::Tag $TAG does not match root package.json v$PKG_VERSION"; exit 1; }
          test "$PKG_VERSION" = "$MCP_VERSION" || { echo "::error::Version drift root vs mcp ($PKG_VERSION vs $MCP_VERSION)"; exit 1; }
          test "$PKG_VERSION" = "$BROWSER_VERSION" || { echo "::error::Version drift root vs browser-extension"; exit 1; }
          test "$PKG_VERSION" = "$VSCODE_VERSION" || { echo "::error::Version drift root vs vscode-extension"; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.12.0

      - name: Setup Node.js (with npm registry for provenance)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Select OIDC-capable npm CLI (hotpug parity)
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # --- Browser extension: deterministic Chrome + Firefox zips ---
      - name: Package browser extension (Chrome + Firefox)
        run: pnpm --filter @kitland/browser-extension package:all

      - name: Verify Chrome / Firefox artifacts exist
        run: |
          ls -lh apps/browser-extension/artifacts/
          test -f "apps/browser-extension/artifacts/kitland-chrome-v$(node -p "require('./package.json').version").zip"
          test -f "apps/browser-extension/artifacts/kitland-firefox-v$(node -p "require('./package.json').version").zip"

      # --- VS Code extension ---
      - name: Package VS Code extension (VSIX)
        run: pnpm --filter kitland-developer-tools package:vsix

      - name: Verify VSIX exists
        run: ls -lh apps/vscode-extension/artifacts/*.vsix

      # --- MCP npm package ---
      - name: Pack MCP tarball (dry-run validation)
        run: pnpm --filter @kitland/mcp package:check

      - name: Capture MCP tarball path
        id: mcp_tarball
        run: |
          TARBALL="$(pnpm --filter @kitland/mcp pack --dry-run 2>&1 | grep -oE 'kitland-mcp-.*\.tgz' | head -1)"
          # Fallback: npm pack json output
          if [ -z "$TARBALL" ]; then
            TARBALL="$(npm pack --json --prefix packages/mcp 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8'))[0]?.filename || ''")"
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "MCP tarball: $TARBALL"

      # --- Publish: npm (MCP) with trusted publishing + provenance ---
      - name: Publish @kitland/mcp to npm
        if: inputs.skip_npm != true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          PKG_VERSION="$(node -p "require('./packages/mcp/package.json').version")"
          TARBALL="packages/mcp/kitland-mcp-${PKG_VERSION}.tgz"
          # Prefer built tarball from verify step; rebuild if missing
          if [ ! -f "$TARBALL" ]; then
            (cd packages/mcp && npm pack)
            TARBALL="packages/mcp/kitland-mcp-${PKG_VERSION}.tgz"
          fi
          # Idempotency: skip if already published with same integrity (hotpug pattern)
          VIEW_OUT="$(mktemp)"; VIEW_ERR="$(mktemp)"
          if npm view "@kitland/mcp@${PKG_VERSION}" dist.integrity --json >"$VIEW_OUT" 2>"$VIEW_ERR"; then
            PUBLISHED="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')))" "$VIEW_OUT")"
            LOCAL="$(node -e "const f=require('fs');const c=require('crypto');process.stdout.write('sha512-'+c.createHash('sha512').update(f.readFileSync(process.argv[1])).digest('base64'))" "$TARBALL")"
            if [ "$PUBLISHED" = "$LOCAL" ]; then
              echo "@kitland/mcp@${PKG_VERSION} already published with matching integrity; skipping."
              exit 0
            else
              echo "::error::npm already has @kitland/mcp@${PKG_VERSION} with different integrity"
              exit 1
            fi
          elif grep -Eq 'E404|404 Not Found' "$VIEW_ERR"; then
            echo "First publish for @kitland/mcp@${PKG_VERSION}"
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then npm whoami --registry=https://registry.npmjs.org/ || true; fi
            npm publish "$TARBALL" --access public --provenance --ignore-scripts
          else
            cat "$VIEW_ERR"; exit 1
          fi

      # --- Publish: VS Code Marketplace + Open VSX (nexusdiff parity) ---
      - name: Publish VS Code extension to Marketplace
        if: inputs.skip_vscode != true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          VSIX="apps/vscode-extension/artifacts/kitland-developer-tools.vsix"
          if [ ! -f "$VSIX" ]; then VSIX="$(ls apps/vscode-extension/artifacts/*.vsix | head -1)"; fi
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT not set – skipping Marketplace publish (artifact remains in GitHub Release)."
            exit 0
          fi
          echo "Publishing $VSIX to VS Code Marketplace…"
          pnpm exec vsce publish --packagePath "$VSIX" --skip-duplicate

      - name: Publish VS Code extension to Open VSX
        if: inputs.skip_vscode != true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          VSIX="apps/vscode-extension/artifacts/kitland-developer-tools.vsix"
          if [ ! -f "$VSIX" ]; then VSIX="$(ls apps/vscode-extension/artifacts/*.vsix | head -1)"; fi
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice::OVSX_PAT not set – skipping Open VSX publish."
            exit 0
          fi
          echo "Publishing $VSIX to Open VSX…"
          pnpm exec ovsx publish "$VSIX" -p "$OVSX_PAT" --skip-duplicate || pnpm dlx ovsx publish "$VSIX" -p "$OVSX_PAT"

      # --- Publish: Chrome Web Store (optional, secret-gated) ---
      - name: Publish Chrome extension to Web Store
        if: inputs.skip_browser != true
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "${CHROME_EXTENSION_ID:-}" ] || [ -z "${CHROME_CLIENT_ID:-}" ]; then
            echo "::notice::Chrome Web Store credentials not set – skipping store submit."
            exit 0
          fi
          ZIP="apps/browser-extension/artifacts/kitland-chrome-v$(node -p "require('./package.json').version").zip"
          echo "Uploading $ZIP to Chrome Web Store (extension $CHROME_EXTENSION_ID)…"
          # Uses chrome-webstore-upload-cli; install on demand to avoid workspace dep
          npx --yes chrome-webstore-upload-cli@3 upload --source "$ZIP" --extension-id "$CHROME_EXTENSION_ID" --client-id "$CHROME_CLIENT_ID" --client-secret "$CHROME_CLIENT_SECRET" --refresh-token "$CHROME_REFRESH_TOKEN" --auto-publish

      # --- Publish: Firefox AMO (optional, secret-gated) ---
      - name: Publish Firefox add-on to AMO
        if: inputs.skip_browser != true
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          if [ -z "${WEB_EXT_API_KEY:-}" ]; then
            echo "::notice::Firefox AMO credentials not set – skipping AMO submit."
            exit 0
          fi
          ZIP="apps/browser-extension/artifacts/kitland-firefox-v$(node -p "require('./package.json').version").zip"
          echo "Submitting $ZIP to Firefox AMO…"
          # web-ext sign expects sources or built xpi; we submit the deterministic zip
          # Use npx web-ext to lint then sign (AMO will return signed xpi) – keep zip as release artifact
          npx --yes web-ext lint --source-dir apps/browser-extension/dist
          # Submit – requires AMO JWT issuer/secret
          npx --yes web-ext sign --source-dir apps/browser-extension/dist --artifacts-dir apps/browser-extension/artifacts --api-key "$WEB_EXT_API_KEY" --api-secret "$WEB_EXT_API_SECRET" --channel listed || echo "::warning::web-ext sign failed – AMO submission requires manual review"

      # --- GitHub Release with all artifacts (nexusdiff + hotpug parity) ---
      - name: Create GitHub Release with artifacts
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          test "$TAG" = "v$PKG_VERSION"
          echo "Creating release $TAG with artifacts…"
          # Collect artifacts
          ARTIFACTS=(
            "apps/browser-extension/artifacts/kitland-chrome-v${PKG_VERSION}.zip"
            "apps/browser-extension/artifacts/kitland-firefox-v${PKG_VERSION}.zip"
            "apps/browser-extension/artifacts/kitland-browser-extension-v${PKG_VERSION}.zip"
            "apps/vscode-extension/artifacts/kitland-developer-tools.vsix"
          )
          # Add MCP tarball if present
          MCP_TARBALL="packages/mcp/kitland-mcp-${PKG_VERSION}.tgz"
          if [ -f "$MCP_TARBALL" ]; then ARTIFACTS+=("$MCP_TARBALL"); fi
          # Filter existing
          EXISTING=()
          for f in "${ARTIFACTS[@]}"; do [ -f "$f" ] && EXISTING+=("$f"); done
          gh release create "$TAG" "${EXISTING[@]}" --verify-tag --generate-notes --title "$TAG" || gh release upload "$TAG" "${EXISTING[@]}" --clobber
        # For workflow_dispatch without tag, upload as pre-release draft is not created – artifacts remain as workflow artifacts

      - name: Upload workflow artifacts (always)
        if: always()
        uses: actions/upload-artifact@b7a3adfd02109298307a45a2e7492601e1a1d781 # v7
        with:
          name: kitland-release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/browser-extension/artifacts/*.zip
            apps/vscode-extension/artifacts/*.vsix
            packages/mcp/*.tgz
          if-no-files-found: warn
          retention-days: 30
